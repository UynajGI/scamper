[package]
name = "scamper"
version = "0.1.0-dev1"
edition = "2021"
authors = ["Scamper Team"]
license = "Apache-2.0"
description = "Monte Carlo simulation stack: scheduling framework plus classical, quantum and statistical kernels"
repository = "https://github.com/UynajGI/scamper"
readme = "../README.md"
keywords = ["monte-carlo", "simulation", "physics", "quantum", "sampling"]
categories = ["science", "simulation"]

[dependencies]
carlo-rs = { path = "../Carlo.rs", version = "0.1.0-dev1" }
cmc-rs = { path = "../CMC.rs", version = "0.1.0-dev1" }
qmc-rs = { path = "../QMC.rs", version = "0.1.0-dev1" }

[features]
default = []
hdf5 = ["carlo-rs/hdf5", "cmc-rs/hdf5", "qmc-rs/hdf5"]
mpi = ["carlo-rs/mpi", "cmc-rs/mpi", "qmc-rs/mpi"]

[lints]
workspace = true
