# Nightly Physics Validation — long-running statistical correctness checks.
#
# Runs daily at 18:00 UTC plus on-demand via workflow_dispatch.
# Uses `--release` for Monte Carlo performance and `-- --ignored` to pick up
# tests that are too slow for every-PR CI.

name: Nightly Physics Validation

on:
  schedule:
    - cron: "37 18 * * *" # daily at 18:37 UTC (off-peak, jittered)
  workflow_dispatch:       # manual trigger from GitHub UI

env:
  CARGO_TERM_COLOR: always

jobs:
  # ── CMC.rs long-running physics tests ──────────────────────────────────
  cmc-physics:
    name: cmc-rs physics
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: nightly-cmc
      - name: Install system dependencies (hdf5, mpi)
        run: |
          sudo apt-get update
          sudo apt-get install -y libhdf5-dev libopenmpi-dev openmpi-bin
      - run: cargo test --release -p cmc-rs --all-features -- --ignored --nocapture

  # ── QMC.rs long-running physics tests ──────────────────────────────────
  qmc-physics:
    name: qmc-rs physics
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: nightly-qmc
      - name: Install system dependencies (hdf5, mpi)
        run: |
          sudo apt-get update
          sudo apt-get install -y libhdf5-dev libopenmpi-dev openmpi-bin
      - run: cargo test --release -p qmc-rs --all-features -- --ignored --nocapture

  # ── MCMC.rs long-running statistical tests ─────────────────────────────
  mcmc-physics:
    name: mcmc-rs physics
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: nightly-mcmc
      - name: Install system dependencies (hdf5, mpi)
        run: |
          sudo apt-get update
          sudo apt-get install -y libhdf5-dev libopenmpi-dev openmpi-bin
      - run: cargo test --release -p mcmc-rs --all-features -- --ignored --nocapture

  # ── Multi-seed z-score monitoring (P2.8) ────────────────────────────────
  # Re-runs every z-score test at a much higher seed count than every-PR CI
  # (64 vs the 3–16 defaults) via SCUTTLE_ZSCORE_SEEDS, giving the per-test
  # |z| / |z̄| assertions far more statistical power to detect a slow drift
  # in sampler correctness. Failure signal = a failed test with per-seed
  # z-scores in the --nocapture log.
  zscore-monitor:
    name: z-score monitor (64 seeds)
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      SCUTTLE_ZSCORE_SEEDS: "64"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: nightly-zscore
      - name: Install system dependencies (hdf5, mpi)
        run: |
          sudo apt-get update
          sudo apt-get install -y libhdf5-dev libopenmpi-dev openmpi-bin
      # `--test suite` restricts the run to the integration-test binary that
      # holds the z-score tests; `--include-ignored` picks up the long ones
      # (Wang-Landau, particle NVT, wormhole ED) at the raised seed count.
      - name: cmc-rs multi-seed z-scores
        run: cargo test --release -p cmc-rs --all-features --test suite zscore -- --nocapture --include-ignored
      - name: qmc-rs multi-seed z-scores
        run: cargo test --release -p qmc-rs --all-features --test suite zscore -- --nocapture --include-ignored
      - name: qmc-rs multi-seed pooled-z ergodicity
        run: cargo test --release -p qmc-rs --all-features --test suite ergodicity_multi_seed -- --nocapture --include-ignored

  # ── Carlo.rs framework regression (HDF5 I/O + MPI backend) ─────────────
  # Serial full suite (including the HDF5 I/O tests) first, then every MPI
  # test under mpirun at several world sizes. Runners are non-root, so
  # mpirun works with the OpenMPI packages installed above (with
  # --oversubscribe, see below).
  carlo-framework:
    name: carlo-rs framework (hdf5 + mpi)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: nightly-carlo
      - name: Install system dependencies (hdf5, mpi)
        run: |
          sudo apt-get update
          sudo apt-get install -y libhdf5-dev libopenmpi-dev openmpi-bin
      # Serial run of the full Carlo.rs suite; the MPI tests are #[ignore]d
      # here (they need mpirun) and are exercised one-by-one below.
      - name: Serial full suite (incl. hdf5)
        run: |
          cargo test --release -p carlo-rs --all-features --test suite
      # Every MPI test gets its own mpirun invocation with an --exact filter:
      # MPI cannot be initialized twice in one process, and cargo runs all
      # matched #[test]s in a single process per rank (double-init abort).
      # `--oversubscribe` is required on CI runners: OpenMPI caps ranks at
      # the core count (2 on hosted runners), so np 4 would be rejected
      # outright. Local MPICH (just mpi-test) has no such cap — don't add
      # this flag there.
      - name: MPI distributed backend (np 1, degenerate single-rank path)
        run: |
          mpirun --oversubscribe -np 1 cargo test --release -p carlo-rs --features mpi,hdf5 --test suite -- --ignored --nocapture --exact mpi_backend_distributed::mpi_backend_distributed_suite
      - name: MPI tests (np 2 and np 4)
        run: |
          for np in 2 4; do
            for test in \
              mpi_backend_distributed::mpi_backend_distributed_suite \
              mpi_test::mpi_tests::mpi_backend_smoke_suite \
              mpi_distributed::distributed_tests::dynamic_scheduler_completes_and_merges_runs \
              mpi_pt_dynamics::pt_exchange_dynamics_suite
            do
              echo "=== np=${np} :: ${test} ==="
              mpirun --oversubscribe -np "${np}" cargo test --release -p carlo-rs --features mpi,hdf5 --test suite -- --ignored --nocapture --exact "${test}"
            done
          done
          # pt_exchange hardcodes a 2-chain config through the
          # run_parallel_tempering entry point (which owns its MPI init and
          # cannot probe the world size first) — np 2 only.
          mpirun --oversubscribe -np 2 cargo test --release -p carlo-rs --features mpi,hdf5 --test suite -- --ignored --nocapture --exact mpi_pt_exchange::pt_exchange_completes_and_returns_results

  # ── Full workspace ignored tests (belt-and-suspenders) ─────────────────
  workspace-ignored:
    name: workspace (all crates, --ignored)
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: nightly-workspace
      - name: Install system dependencies (hdf5, mpi)
        run: |
          sudo apt-get update
          sudo apt-get install -y libhdf5-dev libopenmpi-dev openmpi-bin
      # Belt-and-suspenders rerun of every long (--ignored) physics test
      # across all crates. `--skip mpi` excludes the five Carlo.rs MPI
      # suites: they need one mpirun invocation each (see the carlo-framework
      # job) and abort when cargo runs them in-process. Verified that the
      # only `--ignored` tests matching "mpi" are those five suites.
      - run: cargo test --release --workspace --all-features -- --ignored --nocapture --skip mpi
