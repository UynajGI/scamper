# Publish — tag-driven crates.io release for the Scamper workspace.
#
# A `v*` tag releases one synchronized prerelease line:
#
#   carlo-rs  — dependency root, must land first
#   cmc-rs    — depends on carlo-rs
#   qmc-rs    — depends on carlo-rs
#   scamper   — umbrella crate (carlo + cmc + qmc), must land last
#
# `mcmc-rs` is deliberately excluded. Its crates.io name is occupied by an
# unrelated package and its manifest has `publish = false` until it is renamed.

name: Publish

on:
  push:
    tags: ["v*"]

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  validate:
    name: validate (${{ github.ref_name }})
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Install system dependencies (hdf5, mpi)
        run: |
          sudo apt-get update
          sudo apt-get install -y libhdf5-dev libopenmpi-dev openmpi-bin

      - uses: Swatinem/rust-cache@v2
        with:
          key: release-validation

      - name: Validate release version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          case "$RELEASE_TAG" in
            v?*) RELEASE_VERSION="${RELEASE_TAG#v}" ;;
            *) echo "expected a vX.Y.Z tag, got $RELEASE_TAG" >&2; exit 1 ;;
          esac

          for package in carlo-rs cmc-rs qmc-rs scamper; do
            package_version="$(
              cargo metadata --no-deps --format-version 1 |
                jq -er --arg package "$package" \
                  '.packages[] | select(.name == $package) | .version'
            )"
            if [ "$package_version" != "$RELEASE_VERSION" ]; then
              echo "$package is $package_version, but tag is $RELEASE_TAG" >&2
              exit 1
            fi
          done

      - name: Check formatting
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --all-targets --all-features --workspace

      - name: Test
        run: cargo test --all-features --workspace

      - name: Package dependency root
        # Cargo rewrites workspace path dependencies to registry dependencies
        # while packaging. Before this release exists, cmc-rs/qmc-rs/scamper
        # cannot resolve their new sibling versions from crates.io. The publish
        # job verifies them immediately after their dependencies land.
        run: cargo package -p carlo-rs --no-verify

      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          rust-version: stable
          command: check advisories licenses
          arguments: --all-features

  publish:
    name: publish (${{ github.ref_name }})
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: Publish to crates.io
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          set -euo pipefail

          # Sparse-index propagation of a just-published crate usually takes
          # seconds; retry to ride out a slow window. "already exists" means a
          # previous attempt (or run) actually landed — treat as success so
          # re-running this workflow on the same tag is idempotent.
          publish() {
            local name="$1"
            for i in 1 2 3 4 5; do
              if out=$(cargo publish -p "$name" 2>&1); then
                echo "$out" | tail -3
                return 0
              fi
              if echo "$out" | grep -qiE "already (exists|uploaded)"; then
                echo "$name already on crates.io — treating as success"
                return 0
              fi
              if echo "$out" | grep -q "429 Too Many Requests"; then
                # crates.io throttles how many new crates an account may
                # create in a short window (minutes, not seconds).
                echo "$name rate-limited on new-crate creation; backing off 2 min (attempt $i)"
                sleep 120
                continue
              fi
              echo "::group::attempt $i for $name failed"
              echo "$out" | tail -10
              echo "::endgroup::"
              sleep 20
            done
            echo "giving up on $name after 5 attempts"
            return 1
          }

          publish carlo-rs
          # Let the fresh carlo-rs index entry propagate before dependents
          # resolve it from the registry instead of the local path.
          sleep 15
          publish cmc-rs
          publish qmc-rs
          # The umbrella depends on all three from the registry.
          sleep 15
          publish scamper

      - name: Create or update GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          RELEASE_VERSION="${RELEASE_TAG#v}"
          NOTES="$(cat <<EOF
          Published **carlo-rs**, **cmc-rs**, **qmc-rs** and the **scamper** umbrella crate (${RELEASE_VERSION}) to crates.io.

          Prerelease quality — no API stability guarantees.

          Not on crates.io: mcmc-rs (crate name taken by an unrelated package; workspace-only by design).
          EOF
          )"

          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release edit "$RELEASE_TAG" \
              --title "$RELEASE_TAG" \
              --prerelease \
              --notes "$NOTES"
          else
            gh release create "$RELEASE_TAG" \
              --title "$RELEASE_TAG" \
              --prerelease \
              --generate-notes \
              --notes "$NOTES"
          fi
