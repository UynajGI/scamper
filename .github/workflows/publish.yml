# Publish — tag-driven crates.io release for the scuttle workspace.
#
# A `v*` tag publishes every publishable member of the workspace to crates.io
# and opens a GitHub prerelease. Current members:
#
#   carlo-rs  — dependency root, must land first
#   cmc-rs    — depends on carlo-rs
#   qmc-rs    — depends on carlo-rs
#   scamper   — umbrella crate (carlo + cmc + qmc), must land last
#   mcmc-rs   — NOT published: the `mcmc-rs` crate name is already taken on
#               crates.io by an unrelated crate. It stays path-dependent
#               inside the workspace until it is renamed.
#
# All crates share one version and are cut together, so one tag publishes the
# whole set — adequate for 0.1.0-dev* prereleases; split per-crate tags when
# the versions start to diverge.

name: Publish

on:
  push:
    tags: ["v*"]

permissions:
  contents: write # required to create the GitHub release

env:
  CARGO_TERM_COLOR: always

jobs:
  publish:
    name: publish (${{ github.ref_name }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: Publish to crates.io
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          set -euo pipefail

          # Sparse-index propagation of a just-published crate usually takes
          # seconds; retry to ride out a slow window. "already exists" means a
          # previous attempt (or run) actually landed — treat as success so
          # re-running this workflow on the same tag is idempotent.
          publish() {
            local name="$1"
            for i in 1 2 3 4 5; do
              if out=$(cargo publish -p "$name" 2>&1); then
                echo "$out" | tail -3
                return 0
              fi
              if echo "$out" | grep -qiE "already (exists|uploaded)"; then
                echo "$name already on crates.io — treating as success"
                return 0
              fi
              echo "::group::attempt $i for $name failed"
              echo "$out" | tail -10
              echo "::endgroup::"
              sleep 20
            done
            echo "giving up on $name after 5 attempts"
            return 1
          }

          publish carlo-rs
          # Let the fresh carlo-rs index entry propagate before dependents
          # resolve it from the registry instead of the local path.
          sleep 15
          publish cmc-rs
          publish qmc-rs
          # The umbrella depends on all three from the registry.
          sleep 15
          publish scamper

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release create "${{ github.ref_name }}" \
            --title "${{ github.ref_name }}" \
            --prerelease \
            --generate-notes \
            --notes "$(cat <<'EOF'
          Published **carlo-rs**, **cmc-rs**, **qmc-rs** and the **scamper** umbrella crate (0.1.0-dev1) to crates.io.

          Prerelease quality — no API stability guarantees.

          Not on crates.io: mcmc-rs (crate name taken by an unrelated package; tracked in-repo via a path dependency).
          EOF
          )"

