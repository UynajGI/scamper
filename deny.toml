# cargo-deny configuration for Scamper.
# Docs: https://embarkstudios.github.io/cargo-deny/
#
# Run locally:   cargo deny --all-features check advisories licenses
# Run in CI:     .github/workflows/ci.yml (cargo-deny-action)
# Run in hook:   .lefthook/deny-check.sh  (pre-push, if cargo-deny is installed)
#
# cargo-deny reports advisory classes according to the version bundled by CI.
# Keep this list limited to transitive dependencies without a safe upgrade path;
# real vulnerability, yanked, and unsound advisories remain release blockers.

# ──────────────────────────────────────────────────────────────────────────
# advisories — RUSTSEC vulnerability / yank database
# ──────────────────────────────────────────────────────────────────────────
[advisories]
db-urls = ["https://github.com/rustsec/advisory-db"]

# Per-advisory ignore list. Add a RUSTSEC id here ONLY with a comment
# explaining why, and a reminder date to re-evaluate.
ignore = [
    # Optional MPI support reaches these transitive crates through
    # mpi -> conv -> custom_derive. No safe upgrade path is available.
    "RUSTSEC-2025-0058", # custom_derive unmaintained
    # Optional HDF5 support reaches this crate through hdf5 -> parking_lot.
    # No safe upgrade path is available.
    "RUSTSEC-2024-0384", # instant unmaintained
    # Transitive dependency without a safe upgrade path. Re-evaluate when the
    # parents that pull it in (argmin and simba) publish replacements.
    "RUSTSEC-2024-0436", # paste unmaintained
]

# ──────────────────────────────────────────────────────────────────────────
# licenses — keep the workspace Apache-2.0 compatible
# ──────────────────────────────────────────────────────────────────────────
[licenses]
# Reject anything not in this allow-list. Notably excludes GPL/AGPL/LGPL/
# SSPL/CC-BY-SA (strong copyleft — would viral the whole project) and
# commercial / "no license" crates.
#
# MPL-2.0 is included: it's weak, file-level copyleft that is compatible with
# Apache-2.0 (we can link it without our license changing). It reaches us via
# option-ext -> dirs-sys -> dirs -> shellexpand.
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "MPL-2.0",
    "Zlib",
    "Unicode-3.0",
]
confidence-threshold = 0.8
