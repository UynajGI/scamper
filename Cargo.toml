[workspace]
resolver = "2"
members = ["Carlo.rs", "QMC.rs", "CMC.rs"]

[workspace.dependencies]
rand = "0.10"
rand_core = "0.10"
rand_xoshiro = { version = "0.8", features = ["serde"] }
rayon = "1.10"
thiserror = "2.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tracing = "0.1"
tracing-subscriber = "0.3"
hdf5 = { version = "0.8" }
chrono = { version = "0.4", features = ["serde"] }
mpi = "0.8"
regex = "1"
shellexpand = "3"
ndarray = "0.17"
nalgebra = "0.33"
clap = { version = "4", features = ["derive"] }
indicatif = "0.18"
termcolor = "1"

# Lint policy shared by all workspace members. Mirrors the `-D warnings` that
# the lefthook pre-commit hook historically enforced on the command line, so
# `cargo clippy` / IDE diagnostics now match the hook without RUSTFLAGS tricks.
[workspace.lints.clippy]
all = "deny"

# Rustc built-in lints. `unsafe_code = "deny"` blocks new unsafe by default;
# AI assistants (and humans) must add an explicit `#[allow(unsafe_code)]` with a
# SAFETY justification to use it — the allow then shows up in code review.
[workspace.lints.rust]
unsafe_code = "deny"