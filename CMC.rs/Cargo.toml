[package]
name = "cmc-rs"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "Reusable classical Monte Carlo kernels for lattice, particle, generalized and worm ensembles"
repository.workspace = true
readme = "README.md"
keywords = ["monte-carlo", "classical", "lattice", "simulation", "physics"]
categories = ["science", "simulation"]

[dependencies]
carlo-rs = { workspace = true }
rand = "0.10.0"
rand_xoshiro = "0.8"
serde_json = { workspace = true }
smallvec = "1"

[dev-dependencies]
approx = "0.5"
criterion = { version = "0.5", features = ["html_reports"] }

[[bench]]
name = "particle_bench"
harness = false

[[bench]]
name = "generalized_bench"
harness = false

[[bench]]
name = "performance_bench"
harness = false

[[bench]]
name = "worm_bench"
harness = false

[[bench]]
name = "dynamics_bench"
harness = false

[features]
default = []
cache-audit = []
hdf5 = ["carlo-rs/hdf5"]
mpi = ["carlo-rs/mpi"]

[lints]
workspace = true
