[package]
name = "cmc-rs"
version = "0.1.0-dev1"
edition = "2021"
authors = ["Scuttle Team"]
license = "Apache-2.0"
description = "Reusable classical Monte Carlo kernels for lattice and continuous particle systems"

[dependencies]
carlo-rs = { path = "../Carlo.rs" }
rand = "0.10.0"
rand_xoshiro = "0.8"
serde_json = { workspace = true }
smallvec = "1"

[dev-dependencies]
approx = "0.5"
criterion = { version = "0.5", features = ["html_reports"] }

[[bench]]
name = "particle_bench"
harness = false

[features]
default = []
hdf5 = ["carlo-rs/hdf5"]
mpi = ["carlo-rs/mpi"]

[lints]
workspace = true
