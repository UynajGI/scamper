[package]
name = "qmc-rs"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "Quantum Monte Carlo algorithm toolbox"
repository.workspace = true
readme = "README.md"
keywords = ["quantum", "monte-carlo", "physics", "simulation", "vmc"]
categories = ["science", "simulation"]

[dependencies]
argmin = { version = "0.11", default-features = false }
argmin-math = { version = "0.5", default-features = false, features = [
    "primitives",
    "vec",
] }
carlo-rs = { workspace = true }
nalgebra = { workspace = true }
rand = "0.10.0"
rand_xoshiro = "0.8"
serde_json = { workspace = true }
thiserror = { workspace = true }

[dev-dependencies]
approx = "0.5"

[features]
default = []
hdf5 = ["carlo-rs/hdf5"]
mpi = ["carlo-rs/mpi"]

[lints]
workspace = true