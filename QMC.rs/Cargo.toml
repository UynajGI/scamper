[package]
name = "qmc-rs"
version = "0.1.0-dev1"
edition = "2021"
authors = ["Scamper Team"]
license = "Apache-2.0"
description = "Quantum Monte Carlo algorithm toolbox"
repository = "https://github.com/UynajGI/scamper"
readme = "README.md"
keywords = ["quantum", "monte-carlo", "physics", "simulation", "vmc"]
categories = ["science", "simulation"]

[dependencies]
argmin = { version = "0.11", default-features = false }
argmin-math = { version = "0.5", default-features = false, features = [
    "primitives",
    "vec",
] }
carlo-rs = { path = "../Carlo.rs", version = "0.1.0-dev1" }
nalgebra = { workspace = true }
rand = "0.10.0"
rand_xoshiro = "0.8"
serde_json = { workspace = true }
thiserror = { workspace = true }

[dev-dependencies]
approx = "0.5"

[features]
default = []
hdf5 = ["carlo-rs/hdf5"]
mpi = ["carlo-rs/mpi"]

[lints]
workspace = true